# DSH Trinity CI.
#
# Runs the contract-closure 2.3.0 gates on Node 22 + Node 24 to match
# the supported runtime range documented in package.json#engines and
# README.md.

name: ci

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check:no-llm-in-providers
      - run: pnpm run check:provider-client-sync --check
      - run: npm pack --dry-run
