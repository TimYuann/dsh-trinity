# DSH Trinity bundle patch.
#
# (1) Pin ctx.web.searchProvider to 'web-access-chain-search' and
#     ctx.web.fetchProvider to 'web-access-chain-fetch' so the HOST's own
#     `web_search` / `web_fetch` tools run through this bundle's multi-
#     provider chain. (The shipped `web-fetch-http` provider stays
#     registered under the id `http`; it is simply never selected, because
#     the fetch provider is pinned.) The namespaced ids are a defensive choice (SPEC
#     §II.9): even if a user forgets to uninstall v1.0, no duplicate
#     provider is registered because the ids differ. Standard upgrade is
#     uninstall v1.0 → install the current release.
#
# (2) Disable the two shipped DeepSeek search rows, so the only search and
#     fetch providers this bundle's chain can land on are its own:
#       - `web-search-deepseek` → the Messages-based `deepseek-official`
#         provider. Disabling it also removes the Host's native "Web
#         search" settings page, which only exists while that namespace is
#         served — so the user cannot switch the Host's provider selection
#         away from this bundle behind its back.
#       - `web-deepseek-api` → the `deepseek-search-api` /
#         `deepseek-fetch-api` providers (new in DSH 0.2.1). It was NOT
#         disabled before 2.4.3, which left two unused candidates
#         registered; with (1) in place they were never selected, but an
#         unpinned deployment would have hit WEB_PROVIDER_AMBIGUOUS
#         instead of deterministically using this chain.
#         This row does not exist in the 0.1.7 / 0.2.0 base: the host warns
#         about an unknown patch target and skips it, so older hosts keep
#         working (with one startup warning).
#
# (3) We deliberately do NOT touch the `tool-web` row any more. Since DSH
#     0.2.1 the Host composes the model-facing web tools PER AGENT PRESET
#     (`dsh-web-app/presets/{standard,ptc}.patch.yml` insert `tool-web`;
#     `minimal` does not) and keeps the Host-level row disabled. Older
#     releases of this bundle overrode that row to `disabled: false`,
#     which (a) handed the web tools to presets that intentionally exclude
#     them and (b) only worked while this bundle happened to be layered
#     AFTER `dsh-web-app` — a silent no-op after any reorder. Leaving the
#     row alone keeps the Host's own composition model intact: the
#     standard/ptc presets still expose `web_search` / `web_fetch`, and
#     those tools reach this bundle through the `ctx.web` pinning above.
#
# v2.2: credential refs are DSH env-name refs (EXA_API_KEY / …) — manage
# with `/webdoctor-keys set <provider> <key>`; settings namespace is
# `web-access-chain`.
- id: web
  config:
    searchProvider: web-access-chain-search
    fetchProvider:  web-access-chain-fetch

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

- insert:
  - id: web-access-chain
    name: dsh-trinity
    config:
      # ── Routing (Tool-level overrides exist; this is the global default) ──
      routing: auto

      # ── Runtime budgets (SPEC §I.9) ──
      searchTotalTimeoutMs: 30000
      perProviderTimeoutMs: 8000
      perKeyTimeoutMs: 8000
      maxProvidersPerSearch: 18
      maxKeysPerProvider: 3
      aggregateMaxFanout: 4

      # ── Cache (SPEC §II.3.4) ──
      cacheTtlMs: 3600000
      cacheMaxEntries: 128
      cacheMaxBytes: 134217728

      # ── Fetch policy (SPEC §II.4) ──
      fetchRoutingMode: http-only
      fetchMaxResponseMB: 5
      ssrf:
        allowRanges: []
        trustEnvProxy: false
      proxy: null
      domainPolicy:
        allow: []
        deny: []

      # ── Authenticated fetch profiles (bound to allowlisted Origins) ──
      authFetch: {}

      # ── Adapter gates (whether the adapter exists inside safeFetch) ──
      adapters:
        github: { enabled: true }
        youtube: { enabled: true }
        rss: { enabled: true }
        pdf: { enabled: true }
        genericHtml: { enabled: true }

      # ── Tool gates (whether the standalone Tool is registered) ──
      # Distinct from adapter gates. Adapter on + tool off = the capability
      # exists inside web_fetch but no dedicated Tool card. All specialised
      # tools default to OFF until Commit 3 wires the cheap variants.
      tools:
        githubPrIssue: { enabled: false }
        videoExtract: { enabled: false }
        pdfExtract: { enabled: false, maxPages: null, provider: "unpdf" }

      # ── source_check (SPEC §II.5) ──
      sourceCheck:
        enabled: true
        subQueryCount: 3
        maxPagesFetch: 5
        topPassagesPerSource: 3
        # assessmentModel falls back to ctx.agentDefaultModel when unset

      # ── mmx fallback (v1 carry-over; preserved for R1 stability) ──
      mmxFallback: true
