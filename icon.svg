<?xml version="1.0" encoding="UTF-8"?>
<!--
  DSH Trinity icon - original artwork for this repository.
  Motif: three search nodes wired to one hub (a "trinity" of providers).
  Pure vector, no external references, no embedded fonts.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH Trinity">
  <title>DSH Trinity</title>
  <g stroke="#818CF8" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="34" x2="32" y2="13" />
    <line x1="32" y1="34" x2="13" y2="45" />
    <line x1="32" y1="34" x2="51" y2="45" />
  </g>
  <circle cx="32" cy="13" r="8" fill="#4F46E5" />
  <circle cx="13" cy="45" r="8" fill="#4F46E5" />
  <circle cx="51" cy="45" r="8" fill="#4F46E5" />
  <circle cx="32" cy="34" r="5" fill="#22D3EE" />
</svg>
